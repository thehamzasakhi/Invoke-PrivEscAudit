name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse
        shell: pwsh
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path ./Invoke-PrivEscAudit.ps1), [ref]$null, [ref]$errs) | Out-Null
          if ($errs) { $errs | ForEach-Object { Write-Host "::error::$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }

      - name: PSScriptAnalyzer (errors)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path ./Invoke-PrivEscAudit.ps1 -Severity Error
          $r | Format-Table -AutoSize | Out-String | Write-Host
          if ($r) { exit 1 }

  run:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run audit on Windows PowerShell 5.1
        shell: powershell
        run: ./.github/ci/test-run.ps1

      - name: Run audit on PowerShell 7
        shell: pwsh
        run: ./.github/ci/test-run.ps1
